name: Prueba de «Desactivar StradaOS»

# Manual (issue #9). Instala StradaOS Prueba, lo deja como pantalla de inicio, toca «Desactivar StradaOS» y revisa que
# Android vuelva al launcher de fábrica y que StradaOS ya no se pueda abrir. No se corre en cada cambio porque apaga la app.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salida:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, arch: x86_64 }   # Android 11, como la pantalla del issue #9
          - { api: 19, arch: x86 }   # Android 4.4
    steps:
      - uses: actions/checkout@v4
      - name: Descargar StradaOS Prueba
        run: curl -fsSL --retry 5 -o prueba.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/prueba/StradaOS-prueba.apk"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/salida.sh
