name: Pruebas en emuladores

# Instala la versión de prueba en emuladores de varias versiones de Android (pantalla 1024x600), abre cada
# pantalla, toma capturas y falla si StradaOS se cierra o se traba. Las capturas quedan en la rama «pruebas»
# (carpeta por versión de Android) para revisarlas sin el carro.
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/pruebas.yml', '.github/scripts/smoke.sh' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pruebas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86 }
          - { api: 19, arch: x86 }
          - { api: 21, arch: x86 }
          - { api: 23, arch: x86 }   # Android 6 real, como las pantallas AC8227L
          - { api: 24, arch: x86 }
          - { api: 28, arch: x86 }
          - { api: 30, arch: x86_64 }
          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/smoke.sh ${{ matrix.api }} app-prueba.apk capturas/api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-api${{ matrix.api }}
          path: capturas/

  publicar:
    needs: emulador
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: capturas-*
          path: out
          merge-multiple: true
      - name: Subir capturas a la rama «pruebas»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          {
            echo "# Pruebas en emuladores"
            echo
            echo "Commit: ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            for d in api*; do
              n=$(ls "$d"/*.png 2>/dev/null | wc -l)
              if [ -f "$d/CIERRES.txt" ]; then st="❌ cierre (ver CIERRES.txt)"; elif [ "$n" -gt 0 ]; then st="✅ sin cierres"; else st="⚠️ sin capturas (el emulador no arrancó)"; fi
              echo "- **$d**: $st · $n capturas"
            done
          } > README.md
          git init -q -b pruebas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pruebas
