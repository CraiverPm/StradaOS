name: Sonda (manual)
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://download.mapsforge.org/maps/v5
          echo "== HEAD https"; curl -sI $B/south-america/colombia.map
          echo "== HEAD http"; curl -sI http://download.mapsforge.org/maps/v5/south-america/colombia.map
          echo "== Range"; curl -s -r 0-19 -D - -o /dev/null $B/south-america/colombia.map
          echo "== TLS"; echo | openssl s_client -connect download.mapsforge.org:443 -servername download.mapsforge.org 2>/dev/null | grep -E "Protocol|Cipher|s:|i:" | head
          for v in "-tls1" "-tls1_1" "-tls1_2"; do echo "== $v"; echo | timeout 10 openssl s_client $v -connect download.mapsforge.org:443 -servername download.mapsforge.org 2>&1 | grep -E "Protocol  :|Cipher    :|alert" | head -3; done
          echo "== raiz"; curl -s $B/ | sed -n 1,80p
          echo "== south-america"; curl -s $B/south-america/ | sed -n 1,60p
          echo "== europe (muestra)"; curl -s $B/europe/ | grep -o 'href="[^"]*"' | head -80
          echo "== europe/germany"; curl -s $B/europe/germany/ | grep -o 'href="[^"]*"' | head -30
