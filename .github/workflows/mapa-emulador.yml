name: Mapa sin conexión (emulador)

# Manual: instala StradaOS Prueba, copia colombia.map (mapsforge) al emulador, corta el internet y toma capturas
# del mapa dibujado desde el archivo en Android 4.1 y Android 11. Quedan en las ramas «mapa-emulador-<api>».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86 }
          - { api: 30, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Descargar StradaOS Prueba
        run: curl -fsSL --retry 5 -o prueba.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/prueba/StradaOS-prueba.apk"
      - name: Mapa de Colombia (con caché)
        id: cache
        uses: actions/cache@v4
        with:
          path: colombia.map
          key: mapsforge-colombia-${{ github.run_id }}
          restore-keys: mapsforge-colombia-
      - name: Descargar colombia.map
        run: |
          [ -s colombia.map ] || curl -fL --retry 5 -o colombia.map https://download.mapsforge.org/maps/v5/south-america/colombia.map
          ls -l colombia.map
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          sdcard-path-or-size: 800M
          disk-size: 2000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/mapa.sh
      - name: Subir capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p salida && cd salida
          git init -q -b mapa-emulador-${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Mapa sin conexión en API ${{ matrix.api }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mapa-emulador-${{ matrix.api }}
