name: Ajustes sin saltos (emulador)

# Manual: graba la pantalla mientras se cambian ajustes en varias secciones, para comprobar que la página no salta
# ni parpadea. Los videos quedan en la rama «ajustes-emulador».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Descargar StradaOS Prueba
        run: curl -fsSL --retry 5 -o prueba.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/prueba/StradaOS-prueba.apk"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/ajustes.sh
      - name: Subir videos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p salida && cd salida
          git init -q -b ajustes-emulador
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Ajustes sin saltos (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ajustes-emulador
