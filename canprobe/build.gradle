plugins {
    id 'com.android.application'
}

// CAN Probe: herramienta aparte para ver qué datos del CAN bus (puertas, RPM, velocidad…) expone la pantalla.
android {
    namespace 'com.craiver.canprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.craiver.canprobe'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "CanProbe.apk"
        }
    }
}
